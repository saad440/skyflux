[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skyflux"
version = "0.1.0"
description = "Physics-guided modelling of cloud-modulated solar radiation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "matplotlib>=3.8", "pvlib>=0.16"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
